name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android Licenses and Install Platforms
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools" || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Gradle Wrapper and Keys
        working-directory: tuition-manager
        run: |
          touch .env .env.example
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          gradle wrapper --gradle-version 9.3.1
          chmod +x gradlew

      - name: Build Debug APK
        working-directory: tuition-manager
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Find and Stage APK
        run: |
          mkdir -p output_apk
          find tuition-manager/app/build/outputs/apk/debug/ -name "*.apk" -exec cp {} output_apk/TuitionManager-debug.apk \;
          ls -la output_apk/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TuitionManager-debug-apk
          path: output_apk/TuitionManager-debug.apk
          retention-days: 14

      - name: Publish Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Tuition Manager v1.0.${{ github.run_number }}
          files: output_apk/TuitionManager-debug.apk
          body: |
            ## Tuition Manager Android APK
            Automated build of Tuition Manager from commit ${{ github.sha }}.
            
            Download and install `TuitionManager-debug.apk` on your Android device.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
